services:
  db:
    image: postgres:17
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      # "db" is the service name above; Compose's network resolves it to the DB container
      POSTGRES_HOST: db
    # Dev only: mount the source and run with auto-reload so code changes apply without a rebuild
    volumes:
      - ./app:/code/app
    command: ["fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
